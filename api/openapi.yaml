  "/v1/workloads:orphaned":
    get:
      operationId: listOrphanedWorkloads
      summary: Workloads whose owner is no longer an active human, with their stage.
      tags: [workloads]
      x-route-class: provider
      x-mux-pattern: "GET /v1/workloads:orphaned"
      responses:
        "200":
          $ref: "#/components/responses/WorkloadConditionsAnswer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/v1/workloads:unused":
    get:
      operationId: listUnusedWorkloads
      summary: Workloads unseen for 90 days.
      tags: [workloads]
      x-route-class: provider
      x-mux-pattern: "GET /v1/workloads:unused"
      responses:
        "200":
          $ref: "#/components/responses/WorkloadConditionsAnswer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/v1/workloads:reviews-overdue":
    get:
      operationId: listWorkloadReviewsOverdue
      summary: Workloads whose owner's review is overdue.
      tags: [workloads]
      x-route-class: provider
      x-mux-pattern: "GET /v1/workloads:reviews-overdue"
      responses:
        "200":
          $ref: "#/components/responses/WorkloadConditionsAnswer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  "/v1/deliveries":
    post:
      operationId: acceptDelivery
      summary: Organization Control's dispatcher posts one CloudEvents envelope (TDD-identity-control-002, -006).
      description: |
        Only the delivering workload is admitted. Each event's id passes the inbox guard, so a repeat is
        acknowledged and applied once: no key is required. The application receipt header is set only
        when this consumer holds the event's effect (ADR-GLB-016 §5.4).
      tags: [organization]
      x-route-class: workload
      x-mux-pattern: "POST /v1/deliveries"
      security:
        - workloadBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyIgnored"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudEvent"
      responses:
        "202":
          description: Accepted, applied or discarded.
          content:
            application/json:
              schema:
                type: object
                required: [duplicate, superseded]
                properties:
                  duplicate:
                    type: boolean
                  superseded:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A person's access token, typed at+jwt (RFC 9068), PS256, naming identity-control-api in aud and
        carrying principal_id, acr and auth_time, and no tenant_id or provider_scope (STD-IAM-002 §3.1,
        §3.5). A workload's token is refused on these routes.
    workloadBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Organization Control's workload token, subject_type workload, the principal_id IDENTITY_DELIVERY_PRINCIPAL_ID names.
    enrolmentBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A workload token, subject_type workload, no tenant_id or provider_scope, whose principal_id is an active row of the enrolment caller record (1.2.0).

  headers:
    NoStore:
      description: Never cached.
      schema:
        type: string
        const: no-store
    Location:
      description: The operation's status monitor (RFC 9110 §15.3.3).
      schema:
        type: string

  parameters:
    Forwarded:
      name: Forwarded
      in: header
      required: true
      description: "RFC 7239. The first element's for parameter is the client address the platform's ingress saw: an IPv4 address, or a bracketed IPv6 address in quotes, with an optional port. Missing or malformed is 400. Read on the enrolment caller's call alone (ADR-IAM-011 §5.8)."
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A value unique to this command, sent again unchanged when it is retried. Kept 7 days from completion, then purged; a retry after that is a new command (STD-GLB-001 1.8.0).
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IdempotencyKeyUnlessPlan:
      name: Idempotency-Key
      in: header
      required: false
      description: Required unless the body sets dry_run.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IdempotencyKeyIgnored:
      name: Idempotency-Key
      in: header
      required: false
      description: Not required; a repeat cannot act twice (commands.go keyOptional names the reason). Ignored.
      schema:
        type: string
        maxLength: 255
    AdministrativeReason:
      name: X-Administrative-Reason
      in: header
      required: true
      description: Why, recorded with the action. Visible US-ASCII (RFC 9110 §5.5).
      schema:
        type: string
        minLength: 1
        pattern: "^[\\t\\x20-\\x7e]+$"
    AdministrativeReasonOptional:
      name: X-Administrative-Reason
      in: header
      required: false
      description: Visible US-ASCII; required when the body names findings.
      schema:
        type: string
        pattern: "^[\\t\\x20-\\x7e]+$"
    PrincipalID:
      name: principal_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    RegistrationID:
      name: registration_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    ChangeID:
      name: change_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    RequestID:
      name: request_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    OperationID:
      name: operation_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    AddressID:
      name: address_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    SecurityRef:
      name: security_ref
      in: path
      required: true
      description: An opaque, sealed reference from a listing, bound to its kind, subject and purpose.
      schema:
        type: string

  requestBodies:
    SecurityCommand:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [expected_version]
            properties:
              expected_version:
                type: integer
                format: int64
                minimum: 1
                description: The Principal's security_version, as GET /v1/principals/{principal_id} serves it.
    PrincipalReference:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [principal_id]
            properties:
              principal_id:
                $ref: "#/components/schemas/UUID"

  responses:
    BadRequest:
      description: The request is invalid, or a command carries no Idempotency-Key.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: No valid token, or a step-up is needed (RFC 9470 challenge in WWW-Authenticate).
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The caller's route class does not admit it, or a provider acts on its own Principal.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such resource, or one the caller may not see.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: A refused transition, a version conflict, an idempotency key conflict, or a request in progress.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: The client address is past an enrolment limit (ADR-IAM-011 §5.8).
      headers:
        Retry-After:
          description: Seconds until the longest exceeded window ends (RFC 9110 §10.2.3).
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    EnrolmentCallerAnswer:
      description: The enrolment caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnrolmentCaller"
    EnrolmentCallersAnswer:
      description: Every enrolment caller, oldest first.
      content:
        application/json:
          schema:
            type: object
            required: [enrolment_callers]
            properties:
              enrolment_callers:
                type: array
                items:
                  $ref: "#/components/schemas/EnrolmentCaller"
    Unavailable:
      description: A dependency is unavailable; retry with the same Idempotency-Key.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    OperationFinal:
      description: The operation reached a final state inside the request budget.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SecurityOperation"
    OperationAccepted:
      description: Accepted; the executor finishes it. Location names /v1/security-operations/{operation_id}.
      headers:
        Location:
          $ref: "#/components/headers/Location"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SecurityOperation"
    MyOperationFinal:
      description: The operation reached a final state inside the request budget.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SecurityOperation"
    MyOperationAccepted:
      description: Accepted; the executor finishes it. Location names /v1/me/security-operations/{operation_id}.
      headers:
        Location:
          $ref: "#/components/headers/Location"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SecurityOperation"
    RegistrationAnswer:
      description: The registration as it now stands.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Registration"
    KeysAnswer:
      description: The registration's keys as they now stand.
      content:
        application/json:
          schema:
            type: object
            required: [keys]
            properties:
              keys:
                type: array
                items:
                  $ref: "#/components/schemas/ClientKey"
    OwnersAnswer:
      description: The registration's owners as they now stand.
      content:
        application/json:
          schema:
            type: object
            required: [owners]
            properties:
              owners:
                type: array
                items:
                  $ref: "#/components/schemas/Owner"
    ChangeAnswer:
      description: The change.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RegistrationChange"
    ChangesAnswer:
      description: The changes.
      content:
        application/json:
          schema:
            type: object
            required: [changes]
            properties:
              changes:
                type: array
                items:
                  $ref: "#/components/schemas/RegistrationChange"
    DevelopersAnswer:
      description: The standings as they now stand.
      content:
        application/json:
          schema:
            type: object
            required: [developers]
            properties:
              developers:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationDeveloper"
    RegistrationRequestAnswer:
      description: The request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RegistrationRequest"
    RegistrationRequestsAnswer:
      description: The requests.
      content:
        application/json:
          schema:
            type: object
            required: [requests]
            properties:
              requests:
                type: array
                items:
                  $ref: "#/components/schemas/RegistrationRequest"
    WorkloadAnswer:
      description: The workload.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Workload"
    WorkloadConditionsAnswer:
      description: The workloads in the condition, with when it began.
      content:
        application/json:
          schema:
            type: object
            required: [workloads]
            properties:
              workloads:
                type: array
                items:
                  $ref: "#/components/schemas/WorkloadCondition"

  schemas:
    EnrolmentCaller:
      type: object
      required: [principal_id, purpose, registered_by, register_reason, registered_at, retired_by, retire_reason, retired_at]
      properties:
        principal_id:
          type: string
          format: uuid
        purpose:
          type: string
        registered_by:
          type: string
          format: uuid
        register_reason:
          type: string
        registered_at:
          type: string
          format: date-time
        retired_by:
          type: [string, "null"]
          format: uuid
        retire_reason:
          type: [string, "null"]
        retired_at:
          type: [string, "null"]
          format: date-time
    UUID:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    NullableTimestamp:
      type: [string, "null"]
      format: date-time
    NullableUUID:
      type: [string, "null"]
      format: uuid
    Problem:
      type: object
      description: RFC 9457 problem details, from foundation-platform's closed registry.
      required: [type, title, status, instance]
      properties:
        type:
          type: string
          format: uri
          enum:
            - https://problems.scnehaux.com/validation-failed
            - https://problems.scnehaux.com/authentication-required
            - https://problems.scnehaux.com/forbidden
            - https://problems.scnehaux.com/not-found
            - https://problems.scnehaux.com/version-conflict
            - https://problems.scnehaux.com/idempotency-key-conflict
            - https://problems.scnehaux.com/state-transition-refused
            - https://problems.scnehaux.com/request-in-progress
            - https://problems.scnehaux.com/precondition-unmet
            - https://problems.scnehaux.com/rate-limited
            - https://problems.scnehaux.com/overloaded
            - https://problems.scnehaux.com/dependency-unavailable
            - https://problems.scnehaux.com/internal
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: For a person to read. A client never parses it.
        instance:
          type: string
        correlation_id:
          type: string

    CreatePrincipalRequest:
      type: object
      additionalProperties: false
      required: [username, subject_type]
      properties:
        username:
          type: string
        email:
          type: string
        subject_type:
          type: string
          enum: [human]
          description: A workload is created through POST /v1/workloads.
        workload_owner:
          $ref: "#/components/schemas/UUID"
    PrincipalCreated:
      type: object
      required: [principal_id, subject_type, realm]
      properties:
        principal_id:
          $ref: "#/components/schemas/UUID"
        subject_type:
          type: string
        realm:
          type: string
    PrincipalState:
      type: object
      required: [principal_id, state]
      properties:
        principal_id:
          $ref: "#/components/schemas/UUID"
        state:
          type: string
          enum: [pending, active, suspended, quarantined, retired]
    PrincipalAdoption:
      type: object
      required: [principal_id, adoptable, checks, adopted]
      properties:
        principal_id:
          $ref: "#/components/schemas/UUID"
        adoptable:
          type: boolean
        refusal:
          type: string
        checks:
          type: array
          items:
            type: object
            required: [check, holds, detail]
            properties:
              check:
                type: string
                enum: [orphan_finding, one_kernel_user, newer_than_backup, creation_on_record]
              holds:
                type: boolean
              detail:
                type: string
        adopted:
          type: boolean
        state:
          type: string
          const: suspended
          description: Present once the identifier is adopted.
    DanglingFinding:
      type: object
      required: [principal_id, detected_at]
      properties:
        principal_id:
          $ref: "#/components/schemas/UUID"
        detected_at:
          $ref: "#/components/schemas/Timestamp"
    UserFinding:
      type: object
      required: [finding_id, finding_class, user_disabled, detected_at]
      properties:
        finding_id:
          $ref: "#/components/schemas/UUID"
        finding_class:
          type: string
          enum: [unmapped, orphan, duplicate]
        principal_id:
          $ref: "#/components/schemas/UUID"
        claimed_principal_id:
          type: string
        username:
          type: string
        user_disabled:
          type: boolean
        detected_at:
          $ref: "#/components/schemas/Timestamp"
    PendingMapping:
      type: object
      required: [principal_id, subject_type, username, created_at, overdue]
      properties:
        principal_id:
          $ref: "#/components/schemas/UUID"
        subject_type:
          type: string
        username:
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"
        overdue:
          type: boolean
    QuarantinedMapping:
      type: object
      required: [principal_id, subject_type, username, quarantined_at, quarantine_reason, linked]
      properties:
        principal_id:
          $ref: "#/components/schemas/UUID"
        subject_type:
          type: string
        username:
          type: string
        quarantined_at:
          $ref: "#/components/schemas/NullableTimestamp"
        quarantine_reason:
          type: string
        linked:
          type: boolean
    PrincipalSweepResult:
      type: object
      required: [recovered, dangling, unmapped, orphan, duplicate]
      properties:
        recovered:
          type: integer
        dangling:
          type: integer
        unmapped:
          type: integer
        orphan:
          type: integer
        duplicate:
          type: integer
    PrincipalSummary:
      type: object
      required: [principal_id, username, subject_type, state]
      properties:
        principal_id:
          $ref: "#/components/schemas/UUID"
        username:
          type: string
        email:
          type: string
        subject_type:
          type: string
        state:
          type: string
    InvestigatedPrincipal:
      allOf:
        - $ref: "#/components/schemas/PrincipalSummary"
        - type: object
          required: [realm, created_at, activated_at, quarantined_at, version, security_version]
          properties:
            realm:
              type: string
            workload_owner:
              $ref: "#/components/schemas/UUID"
            created_at:
              $ref: "#/components/schemas/Timestamp"
            activated_at:
              $ref: "#/components/schemas/NullableTimestamp"
            quarantined_at:
              $ref: "#/components/schemas/NullableTimestamp"
            quarantine_reason:
              type: string
            version:
              type: integer
              format: int64
            security_version:
              type: integer
              format: int64
              description: The expected_version a containment command names.
    Session:
      type: object
      required: [started, last_access, clients]
      properties:
        started:
          $ref: "#/components/schemas/Timestamp"
        last_access:
          $ref: "#/components/schemas/Timestamp"
        clients:
          type: array
          items:
            type: string
    MySession:
      allOf:
        - $ref: "#/components/schemas/Session"
        - type: object
          required: [security_ref, current]
          properties:
            security_ref:
              type: string
            current:
              type: boolean
    Authenticator:
      type: object
      required: [type, created]
      properties:
        security_ref:
          type: string
        type:
          type: string
        label:
          type: string
        created:
          $ref: "#/components/schemas/Timestamp"
        remaining_codes:
          type: integer
        total_codes:
          type: integer
    MyAuthenticator:
      allOf:
        - $ref: "#/components/schemas/Authenticator"
        - type: object
          required: [security_ref]
    MyConsent:
      type: object
      required: [security_ref, client, scopes, granted_at, access_token_lifetime_seconds]
      properties:
        security_ref:
          type: string
        client:
          type: string
          description: The client's client_key.
        scopes:
          type: array
          items:
            type: string
        granted_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/NullableTimestamp"
        access_token_lifetime_seconds:
          type: [integer, "null"]
          description: The registered access token lifetime, the bound an already-issued token lives after a withdrawal; null for a client no registration describes.
    FederationLink:
      type: object
      required: [provider, user_name]
      properties:
        provider:
          type: string
        user_name:
          type: string
    PrincipalFinding:
      type: object
      required: [finding_id, class, detected_at, resolved_at]
      properties:
        finding_id:
          $ref: "#/components/schemas/UUID"
        class:
          type: string
        detected_at:
          $ref: "#/components/schemas/Timestamp"
        resolved_at:
          $ref: "#/components/schemas/NullableTimestamp"
        resolution:
          type: string
    PrincipalEvent:
      type: object
      required: [occurred_at, kind, role, type, outcome]
      properties:
        occurred_at:
          $ref: "#/components/schemas/Timestamp"
        kind:
          type: string
          enum: [user, admin]
        role:
          type: string
          enum: [subject, actor]
        type:
          type: string
        outcome:
          type: string
        error:
          type: string
        client_id:
          type: string
        resource_type:
          type: string
    NotificationAddress:
      type: object
      required: [address_id, channel, address, origin, state, added_at]
      properties:
        address_id:
          $ref: "#/components/schemas/UUID"
        channel:
          type: string
        address:
          type: string
        origin:
          type: string
        state:
          type: string
        added_at:
          $ref: "#/components/schemas/Timestamp"
        verified_at:
          $ref: "#/components/schemas/Timestamp"
        proof_expires_at:
          $ref: "#/components/schemas/Timestamp"
    NotificationAddressAnswer:
      type: object
      required: [notification_address]
      properties:
        notification_address:
          $ref: "#/components/schemas/NotificationAddress"
    InvestigatedAddress:
      type: object
      required: [address_id, channel, address, origin, state, added_at]
      properties:
        address_id:
          $ref: "#/components/schemas/UUID"
        channel:
          type: string
        address:
          type: string
        origin:
          type: string
        state:
          type: string
        added_at:
          $ref: "#/components/schemas/Timestamp"
        verified_at:
          $ref: "#/components/schemas/Timestamp"
        removed_at:
          $ref: "#/components/schemas/Timestamp"
    SecurityNotification:
      type: object
      required: [notification_id, event, occurred_at, details, recipients, state, attempts, requested_at]
      properties:
        notification_id:
          $ref: "#/components/schemas/UUID"
        event:
          type: string
        occurred_at:
          $ref: "#/components/schemas/Timestamp"
        details:
          type: object
          additionalProperties:
            type: string
        recipients:
          type: integer
        state:
          type: string
        attempts:
          type: integer
        requested_at:
          $ref: "#/components/schemas/Timestamp"
        submitted_at:
          $ref: "#/components/schemas/Timestamp"
    TemporaryPasswordAnswer:
      type: object
      required: [temporary_password]
      properties:
        temporary_password:
          type: object
          required: [issuance_id, principal_id, issued_by, issued_at, lapses_at]
          properties:
            issuance_id:
              $ref: "#/components/schemas/UUID"
            principal_id:
              $ref: "#/components/schemas/UUID"
            issued_by:
              $ref: "#/components/schemas/UUID"
            issued_at:
              $ref: "#/components/schemas/Timestamp"
            lapses_at:
              $ref: "#/components/schemas/Timestamp"
            value:
              type: string
              description: Present in the first answer alone.
    SecurityOperation:
      type: object
      required: [operation_id, principal_id, operation_type, state, attempts, created_at]
      properties:
        operation_id:
          $ref: "#/components/schemas/UUID"
        principal_id:
          $ref: "#/components/schemas/UUID"
        operation_type:
          type: string
          examples: [suspend, restore, sessions.terminate-all, authenticator.revoke, session.terminate, authenticator.remove]
        state:
          type: string
          enum: [pending, retrying, applied, refused, unresolved]
        attempts:
          type: integer
        result_code:
          type: string
          examples: [last_authenticator, assurance_floor]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        applied_at:
          $ref: "#/components/schemas/Timestamp"
    ParkedOperation:
      type: object
      required: [operation_id, principal_id, operation_type, attempts, created_at]
      properties:
        operation_id:
