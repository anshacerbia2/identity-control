          $ref: "#/components/schemas/UUID"
        outcome:
          type: string
          enum: [satisfactory, findings]
        statement:
          type: string
        reviewed_at:
          $ref: "#/components/schemas/Timestamp"

    PublicJWK:
      type: object
      description: |
        One RSA public key of at least 3072 bits, as a JWK. A private member is refused, and so is any
        member but these six (internal/registration/publickey.go). `use` and `alg` are optional; an
        empty value is read as absent.
      required: [kty, n, e]
      additionalProperties: false
      properties:
        kty:
          type: string
          const: RSA
        kid:
          type: string
        use:
          type: string
          const: sig
          description: For signatures, if the key names a use.
        alg:
          type: string
          const: PS256
          description: PS256, if the key names an algorithm (STD-IAM-001 §3.2).
        n:
          type: string
        e:
          type: string
    RegisterRequest:
      type: object
      required: [client_key, profile, audience_class, application_ref]
      properties:
        client_key:
          type: string
        profile:
          type: string
          enum: [public, confidential, workload, resource]
        audience_class:
          type: string
          enum: [internal, privileged, workload, external]
        privileged_form:
          type: string
          enum: [provider-scope, tenant-scoped, per-sign-in]
          description: Named for the privileged class alone.
        application_ref:
          type: string
        lifetime_class:
          type: string
          enum: [L0, L1, L2, L3]
          description: A resource's lifetime class.
        audience:
          type: array
          items:
            type: string
        redirect_uris:
          type: array
          items:
            type: string
            format: uri
        public_key:
          $ref: "#/components/schemas/PublicJWK"
        backchannel_logout_uri:
          type: string
          format: uri
          description: A confidential client's back-channel logout URI (ADR-IAM-009).
    Registration:
      type: object
      required: [registration_id, realm, client_key, profile, audience_class, application_authority, application_ref,
        registered_by, signing_algorithm, audience, redirect_uris, state, version, created_at, consent_required]
      properties:
        registration_id:
          $ref: "#/components/schemas/UUID"
        realm:
          type: string
        client_key:
          type: string
        consent_required:
          type: boolean
          description: Whether the client asks a person's consent at sign-in, derived from its audience class and never set (STD-IAM-002 1.9.0 §3.6).
        profile:
          type: string
          enum: [public, confidential, workload, resource]
        audience_class:
          type: string
          enum: [internal, privileged, workload, external]
        privileged_form:
          type: string
        application_authority:
          type: string
        application_ref:
          type: string
        registered_by:
          $ref: "#/components/schemas/UUID"
        signing_algorithm:
          type: string
        lifetime_class:
          type: string
        audience:
          type: array
          items:
            type: string
        redirect_uris:
          type: array
          items:
            type: string
        access_token_lifespan:
          type: integer
          description: Seconds, derived from the audience's lifetime classes.
        backchannel_logout_uri:
          type: string
        state:
          type: string
          enum: [pending, active, suspended, retired]
        version:
          type: integer
          format: int64
        created_at:
          $ref: "#/components/schemas/Timestamp"
    AdoptRequest:
      type: object
