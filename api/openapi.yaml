  "/v1/enrolments":
    post:
      operationId: requestEnrolment
      summary: Ask for a code to enrol from an invitation (ADR-IAM-011 §5.1, §5.2, §5.8, §5.9).
      description: |
        Always `202` with one body when the request is admitted: a code was sent to the invited address
        if the invitation can be redeemed and no account holds the address. An unknown, expired,
        revoked or accepted token, an address held already, an open enrolment and the invitation's
        message limit are not told apart; the identifier is fresh in every case. The client address is
        counted from `Forwarded` (5 a minute, 20 an hour): past it, `429` with `Retry-After`. No key is
        required. Added in 1.2.0.
      tags: [enrolment]
      x-route-class: enrolment-caller
      x-mux-pattern: "POST /v1/enrolments"
      security:
        - enrolmentBearer: []
      parameters:
        - $ref: "#/components/parameters/Forwarded"
        - $ref: "#/components/parameters/IdempotencyKeyIgnored"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 1
      responses:
        "202":
          description: Accepted; see the description.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                type: object
                required: [enrolment_id]
                properties:
                  enrolment_id:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/enrolments/{enrolment_id}:verify":
    post:
      operationId: verifyEnrolment
      summary: Return the code; create the Principal and show its temporary password once (ADR-IAM-011 §5.3).
      description: |
        The right code creates the Principal (username the invited address, lower-cased; its creation
        address proven) and answers a temporary password once, with `no-store` (STD-IAM-001 3.1.0
        §3.1). A wrong, expired or exhausted code, an unknown enrolment, an address held by then, and
        the invitation's 15 failed codes a day are one `400` with one detail. The client address is
        counted (5 a minute, 30 an hour): past it, `429` with `Retry-After`. A `503` leaves the code good:
        retry it. No key is required. Added in 1.2.0.
      tags: [enrolment]
      x-route-class: enrolment-caller
      x-mux-pattern: "POST /v1/enrolments/{enrolment_action}"
      security:
        - enrolmentBearer: []
      parameters:
        - name: enrolment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Forwarded"
        - $ref: "#/components/parameters/IdempotencyKeyIgnored"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "201":
          description: The Principal, and its temporary password, shown once.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                type: object
                required: [principal_id, username, temporary_password, lapses_at]
                properties:
                  principal_id:
                    type: string
                    format: uuid
                  username:
                    type: string
                  temporary_password:
                    type: string
                    description: 24 symbols of Crockford's base32; temporary in the kernel, never stored or logged.
                  lapses_at:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
