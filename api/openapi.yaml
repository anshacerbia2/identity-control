openapi: 3.1.0
info:
  title: Identity Control API
  version: 1.3.0
  summary: The control plane of the Scnehaux Identity Runtime (SAD-001).
  description: |
    The HTTP contract of identity-control, published as a versioned artifact under ADR-GLB-010
    §5.1: "Each served API SHALL publish its specification (OpenAPI for HTTP) as a versioned
    artifact". It is hand-maintained beside `internal/httpapi/routes.go`, and
    `internal/httpapi/openapi_test.go` fails the build when a route is registered without an operation
    here, or an operation names a route that is not registered.

    **Versioning.** `info.version` is this document's version, bumped in the same commit as the code
    it describes, under ADR-GLB-006's compatibility rules: the major version for a change that breaks
    a client (a route, field, value or status removed or renamed, or a field becoming required), the
    minor version for an addition (a route, an action, an optional field, a new value of an open
    set), and the patch version for a correction of the description alone. The repository commit
    pins it for a consumer.

    **Mux patterns.** Go's `net/http` mux matches whole path segments, so a custom method such as
    `:relink` is part of one wildcard segment there (`POST /v1/principals/{target}`). Here each action
    is its own path, so a client sees each action's body and answers. Every operation names the mux
    pattern that serves it in `x-mux-pattern`, exactly as `routes.go` writes it.

    **Route classes** (`x-route-class`, TDD-identity-control-005 §What Changed in 2.0.0,
    TDD-identity-control-003 §Registration Ownership):
    - `provider`: a Principal holding provider authority by this service's projection of
      Organization's grants (TDD-identity-control-006), at `acr` `aal2` (ADR-IAM-004). Anyone else is
      answered `403` before anything is read.
    - `owner`: a provider, or an owner of the registration or workload the path names; another
      caller is answered `404`, as for a record that does not exist.
    - `creator`: a provider, or a Principal holding application developer standing.
    - `self`: any person, acting on the Principal in its own token.
    - `person`: any authenticated person; the answer is about the caller.
    - `workload`: one named workload, verified by the route itself (Organization Control's).
    - `enrolment-caller`: a workload the enrolment caller record admits (Identity Experience's BFF),
      verified by the route itself, for a person who is not signed in; it forwards the client address
      in `Forwarded` (ADR-IAM-011 §5.8, 1.2.0).
    - `probe`: no authentication.

    **Commands** (STD-GLB-001 1.4.0 §Commands Require an Idempotency-Key). Every mutating route is
    classified in `internal/httpapi/commands.go`; a command without an `Idempotency-Key` is answered
    `400`. A retry with the same key and body answers the first answer. An administrative command
    also carries `X-Administrative-Reason`, visible US-ASCII (STD-GLB-001 §Request Header Values).

    **Key retention** (STD-GLB-001 1.8.0, TDD-identity-control-003 §Key Retention). A completed
    command's key, and the answer recorded with it, is kept 7 days from completion, then purged. A
    retry after that is a new command. A key whose command has not completed is never purged. A
    command that answers a secret, the temporary password of
    `POST /v1/principals/{principal_id}:issue-temporary-password`, records its answer without the
    secret, so a retry answers the issuance without the value (STD-GLB-001 1.7.0).

    **Errors** are RFC 9457 problem details from foundation-platform's closed registry. A client
    branches on `type`, never on `detail`.
  contact:
    name: Core Platform Team
  license:
    name: Proprietary
    identifier: LicenseRef-Scnehaux-Proprietary
servers:
  - url: http://127.0.0.1:8081
    description: A development server's loopback port (deploy/dev/README.md).
security:
  - bearer: []
tags:
  - name: probes
    description: "Liveness and readiness, unauthenticated."
  - name: principals
    description: "Principal creation and the canonical registry (TDD-identity-control-001)."
  - name: investigation
    description: "A provider's reads of another Principal, each recorded (TDD-identity-control-005)."
  - name: containment
    description: "A provider's security commands on another Principal, through the durable executor (TDD-identity-control-005)."
  - name: self
    description: "A person's own sessions, authenticators, consents and addresses."
  - name: registrations
    description: "Protocol clients and protected resources (TDD-identity-control-003)."
  - name: application-developers
    description: "Application developer standing (ADR-IAM-003 §5.3)."
  - name: registration-requests
    description: "Production registration by request (ADR-IAM-003 §5.3)."
  - name: workloads
    description: "Workload identity (TDD-identity-control-004)."
  - name: projections
    description: "The Tenant context and provider authority projections of Organization's records (TDD-identity-control-002, -006)."
  - name: kernel-events
    description: "The kernel event record (TDD-identity-control-007)."
  - name: ceremony
    description: "The bootstrap ceremony record and its review (ADR-IAM-001 §5.11)."
  - name: organization
    description: "The routes Organization Control's workload calls."
  - name: enrolment
    description: "Enrolment from an invitation, for a person with no account, through the BFF workload (ADR-IAM-011)."
paths:
  "/healthz":
    get:
      operationId: liveness
      summary: Liveness. Touches no dependency.
      tags: [probes]
      x-route-class: probe
      x-mux-pattern: "GET /healthz"
      security: []
      responses:
        "200":
          description: The process serves.
          content:
            text/plain:
              schema:
                type: string
                const: "ok\n"
  "/readyz":
    get:
      operationId: readiness
      summary: Readiness. Answers whether the Control Database is reachable.
      tags: [probes]
      x-route-class: probe
      x-mux-pattern: "GET /readyz"
      security: []
      responses:
        "200":
          description: The replica can serve.
          content:
            text/plain:
              schema:
                type: string
                const: "ready\n"
        "503":
          $ref: "#/components/responses/Unavailable"

  "/v1/principals":
    post:
      operationId: createPrincipal
      summary: Mint a principal_id and create its kernel user (TDD-identity-control-001).
      tags: [principals]
      x-route-class: provider
      x-mux-pattern: "POST /v1/principals"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrincipalRequest"
      responses:
        "201":
          description: The Principal, created or replayed for the same key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrincipalCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/principals/{principal_id}:relink":
    post:
      operationId: relinkPrincipal
      summary: Return an active mapping whose kernel user is gone to pending, for recovery to recreate.
      description: Refused 409 while the kernel user still exists. Replayed for the same key.
      tags: [principals]
      x-route-class: provider
      x-mux-pattern: "POST /v1/principals/{target}"
      parameters:
        - $ref: "#/components/parameters/PrincipalID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AdministrativeReason"
      responses:
        "200":
          description: The mapping, now pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrincipalState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/principals/{principal_id}:release":
    post:
      operationId: releasePrincipal
      summary: Bind a quarantined mapping to the one kernel user left, and move it to suspended.
      description: A caller releasing the Principal in its own token is answered 403 (TDD-identity-control-001 1.22.0).
      tags: [principals]
      x-route-class: provider
      x-mux-pattern: "POST /v1/principals/{target}"
      parameters:
        - $ref: "#/components/parameters/PrincipalID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AdministrativeReason"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username]
              properties:
                username:
                  type: string
                  description: The kernel user the duplicate triage decided is the person.
      responses:
        "200":
          description: The mapping, now suspended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrincipalState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/principals/{principal_id}:adopt":
    post:
      operationId: adoptPrincipal
      summary: Re-adopt an orphan's identifier after a restore to an older point (ADR-IAM-001 §5.11).
      description: |
        Plans first with `dry_run`. It refuses unless an open orphan finding names the identifier,
        exactly one kernel user carries it, its UUIDv7 time is later than the newest mapping the
        restored database holds, and a kernel admin event records this service's own Admin API client
        creating that user. An adopted mapping lands `suspended`; `:restore` returns it to service.
      tags: [principals]
      x-route-class: provider
      x-mux-pattern: "POST /v1/principals/{target}"
      parameters:
        - $ref: "#/components/parameters/PrincipalID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AdministrativeReason"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                dry_run:
                  type: boolean
                  default: false
                  description: Plan only.
      responses:
        "200":
          description: The plan for a dry run, or, with `adopted` true, the adoption; its mapping is suspended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrincipalAdoption"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/principals/{principal_id}:suspend":
    post:
      operationId: suspendPrincipal
      summary: Contain a human Principal by disabling its kernel user and ending its sessions (TDD-identity-control-005).
      description: Needs an authentication within IDENTITY_STEP_UP_MAX_AGE; an older one is answered 401 with an RFC 9470 challenge. A provider cannot act on its own Principal.
      tags: [containment]
      x-route-class: provider
      x-mux-pattern: "POST /v1/principals/{target}"
      parameters:
        - $ref: "#/components/parameters/PrincipalID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AdministrativeReason"
      requestBody:
        $ref: "#/components/requestBodies/SecurityCommand"
      responses:
        "200":
          $ref: "#/components/responses/OperationFinal"
        "202":
          $ref: "#/components/responses/OperationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  "/v1/principals/{principal_id}:restore":
    post:
      operationId: restorePrincipal
      summary: Return a suspended human Principal to service; no session is restored.
      tags: [containment]
      x-route-class: provider
      x-mux-pattern: "POST /v1/principals/{target}"
      parameters:
        - $ref: "#/components/parameters/PrincipalID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AdministrativeReason"
      requestBody:
        $ref: "#/components/requestBodies/SecurityCommand"
      responses:
        "200":
          $ref: "#/components/responses/OperationFinal"
        "202":
          $ref: "#/components/responses/OperationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  "/v1/principals/{principal_id}:issue-temporary-password":
    post:
      operationId: issueTemporaryPassword
      summary: Issue a first credential to a person who has never set one (ADR-IAM-010).
      description: |
        Answered once with `Cache-Control: no-store`. A retry with the same key answers `200` with the
        issuance and without the value, which is in no row, log or idempotency record. Needs a recent
        `aal2`.
      tags: [principals]
      x-route-class: provider
      x-mux-pattern: "POST /v1/principals/{target}"
      parameters:
        - $ref: "#/components/parameters/PrincipalID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AdministrativeReason"
      requestBody:
        required: false
        description: Empty or `{}`. The value is generated, never chosen.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        "201":
          description: The issuance, carrying the value this once.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporaryPasswordAnswer"
        "200":
          description: A replay, without the value.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporaryPasswordAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/principals:dangling":
    get:
      operationId: listDanglingPrincipals
      summary: Active Principals whose kernel user is gone.
      tags: [principals]
      x-route-class: provider
      x-mux-pattern: "GET /v1/principals:dangling"
      responses:
        "200":
          description: The open dangling findings.
          content:
            application/json:
              schema:
                type: object
                required: [dangling]
                properties:
                  dangling:
                    type: array
                    items:
                      $ref: "#/components/schemas/DanglingFinding"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/v1/principals:unmapped":
    get:
      operationId: listUnmappedUsers
      summary: Open findings about kernel users no mapping accounts for (unmapped, orphan, duplicate).
      tags: [principals]
      x-route-class: provider
      x-mux-pattern: "GET /v1/principals:unmapped"
      responses:
        "200":
          description: The open findings.
          content:
            application/json:
              schema:
                type: object
                required: [unmapped]
                properties:
                  unmapped:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserFinding"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/v1/principals:pending":
    get:
      operationId: listPendingPrincipals
      summary: Mappings recovery has not resolved, oldest first.
      tags: [principals]
      x-route-class: provider
      x-mux-pattern: "GET /v1/principals:pending"
      responses:
        "200":
          description: The pending mappings.
          content:
            application/json:
              schema:
                type: object
                required: [pending]
                properties:
                  pending:
                    type: array
                    items:
                      $ref: "#/components/schemas/PendingMapping"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/v1/principals:quarantined":
    get:
      operationId: listQuarantinedPrincipals
      summary: Mappings the reconciler holds.
      tags: [principals]
      x-route-class: provider
      x-mux-pattern: "GET /v1/principals:quarantined"
      responses:
        "200":
          description: The quarantined mappings.
          content:
            application/json:
              schema:
                type: object
                required: [quarantined]
                properties:
                  quarantined:
                    type: array
                    items:
                      $ref: "#/components/schemas/QuarantinedMapping"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/v1/principals:reconcile":
    post:
      operationId: reconcilePrincipals
      summary: Pending recovery and the Principal sweep, now. No key is required (a sweep).
      tags: [principals]
      x-route-class: provider
      x-mux-pattern: "POST /v1/principals:reconcile"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyIgnored"
      responses:
        "200":
          description: What the sweep found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrincipalSweepResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/principals:search":
    get:
      operationId: searchPrincipals
      summary: A prefix lookup on the username or email this service holds; never a listing.
      description: Every served read is recorded in identity.privileged_access.
      tags: [investigation]
      x-route-class: provider
      x-mux-pattern: "GET /v1/principals:search"
      parameters:
        - name: q
          in: query
          required: true
          description: At least IDENTITY_ADMIN_SEARCH_MIN_LENGTH characters that are not wildcards; a wildcard is literal.
          schema:
            type: string
      responses:
        "200":
          description: At most IDENTITY_ADMIN_SEARCH_PAGE_SIZE matches.
          content:
            application/json:
              schema:
                type: object
                required: [principals]
                properties:
                  principals:
                    type: array
                    items:
                      $ref: "#/components/schemas/PrincipalSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/v1/principals/{principal_id}":
    get:
      operationId: getPrincipal
      summary: One Principal, with the security_version its containment commands name.
      tags: [investigation]
      x-route-class: provider
      x-mux-pattern: "GET /v1/principals/{principal_id}"
      parameters:
        - $ref: "#/components/parameters/PrincipalID"
      responses:
        "200":
          description: The Principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestigatedPrincipal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/v1/principals/{principal_id}/sessions":
    get:
      operationId: listPrincipalSessions
      summary: The Principal's kernel sessions, with no IP address and no kernel identifier.
      tags: [investigation]
      x-route-class: provider
      x-mux-pattern: "GET /v1/principals/{principal_id}/sessions"
      parameters:
        - $ref: "#/components/parameters/PrincipalID"
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/principals/{principal_id}/sessions:terminate-all":
    post:
      operationId: terminatePrincipalSessions
      summary: End every session of another Principal.
      tags: [containment]
      x-route-class: provider
      x-mux-pattern: "POST /v1/principals/{principal_id}/sessions:terminate-all"
      parameters:
        - $ref: "#/components/parameters/PrincipalID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AdministrativeReason"
      requestBody:
        $ref: "#/components/requestBodies/SecurityCommand"
      responses:
        "200":
          $ref: "#/components/responses/OperationFinal"
        "202":
          $ref: "#/components/responses/OperationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  "/v1/principals/{principal_id}/authenticators":
    get:
      operationId: listPrincipalAuthenticators
      summary: The Principal's authenticators' metadata, each with a security_ref sealed for revocation.
      tags: [investigation]
      x-route-class: provider
      x-mux-pattern: "GET /v1/principals/{principal_id}/authenticators"
      parameters:
        - $ref: "#/components/parameters/PrincipalID"
      responses:
        "200":
          description: The authenticators.
          content:
            application/json:
              schema:
                type: object
                required: [authenticators]
                properties:
                  authenticators:
                    type: array
                    items:
                      $ref: "#/components/schemas/Authenticator"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/principals/{principal_id}/authenticators/{security_ref}:revoke":
    post:
      operationId: revokePrincipalAuthenticator
      summary: Revoke one authenticator of another Principal. The last first factor is refused (last_authenticator).
      tags: [containment]
      x-route-class: provider
      x-mux-pattern: "POST /v1/principals/{principal_id}/authenticators/{authenticator_action}"
      parameters:
        - $ref: "#/components/parameters/PrincipalID"
        - $ref: "#/components/parameters/SecurityRef"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AdministrativeReason"
      requestBody:
        $ref: "#/components/requestBodies/SecurityCommand"
      responses:
        "200":
          $ref: "#/components/responses/OperationFinal"
        "202":
          $ref: "#/components/responses/OperationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  "/v1/principals/{principal_id}/federation-links":
    get:
      operationId: listPrincipalFederationLinks
      summary: The Principal's federation links.
      tags: [investigation]
      x-route-class: provider
      x-mux-pattern: "GET /v1/principals/{principal_id}/federation-links"
      parameters:
        - $ref: "#/components/parameters/PrincipalID"
      responses:
        "200":
          description: The links.
          content:
            application/json:
              schema:
