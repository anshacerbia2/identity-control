# identity-control on the development server, beside identity-kernel's deploy/dev stack.
#
#   docker compose up -d --build
#
# Its own Control Database -- EAD-003 keeps each domain's persistence private -- a one-shot migration
# job that must succeed before the service starts, and the service. It reaches Keycloak over the
# kernel's scnehaux-identity-api network, which carries Keycloak alone, so it cannot reach the
# kernel's database or proxy. Start the kernel stack first; that network is created there.

name: scnehaux-identity-control-dev

services:
  postgres:
    # postgres:17.11-alpine
    image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [internal]

  migrate:
    build:
      context: ../..
      target: migrate
      # From .env: GOPROXY=direct where the network intercepts TLS to the module proxy
      # (STD-GLB-009 §Development Server Deployment). go.sum and the checksum database still verify
      # every module either way.
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    # Named, so every one-off task below runs this image and `up --build` rebuilds them with the
    # release (STD-GLB-009 §Development Server Deployment).
    image: scnehaux-identity-control-dev-migrate
    # Built here, never pulled. Without this, Compose first tries to pull the name from a registry,
    # and a published image of that name would run instead (TDD-identity-control-001
    # §The Migrate Image and Its Exceptions).
    pull_policy: build
    restart: "no"
    environment:
      POSTGRES_SUPER_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432
      IDENTITY_APP_PASSWORD: ${IDENTITY_APP_PASSWORD:?set IDENTITY_APP_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  # The bootstrap ceremony, run once by an operator through bootstrap.sh -- never by `up`, which is
  # what the profile is for. It uses the runtime credential, not the migration one: a ceremony able
  # to alter the schema could remove the constraint that makes it single-use.
  bootstrap:
    image: scnehaux-identity-control-dev-migrate
    # The image the migrate service builds; never pulled from a registry, so a task run before
    # the build fails instead of running a published image of the same name.
    pull_policy: never
    profiles: ["ceremony"]
    entrypoint: ["identity-bootstrap"]
    # The key file belongs to KEYS_OWNER and is readable by it alone, so the ceremony runs as that
    # user. See create-kernel-clients.sh.
    user: "${KEYS_OWNER:-65532:65532}"
    environment:
      IDENTITY_DATABASE_URL: postgres://identity_app:${IDENTITY_APP_PASSWORD:?set IDENTITY_APP_PASSWORD in .env}@postgres:5432/identity_control?sslmode=disable
      IDENTITY_KEYCLOAK_REALM: scnehaux
      IDENTITY_KEYCLOAK_BASE_URL: http://keycloak:8080
      IDENTITY_KEYCLOAK_CLIENT_ID: identity-control
      IDENTITY_KEYCLOAK_CLIENT_KEY_FILE: /keys/identity-control.pem
      # The ceremony registers this service's resource through the registration path's own client,
      # under the name the service verifies as its audience (ADR-IAM-001 §5.11 rule 5).
      IDENTITY_REGISTRATION_KEYCLOAK_CLIENT_ID: identity-control-registration
      IDENTITY_REGISTRATION_KEYCLOAK_CLIENT_KEY_FILE: /keys/identity-control-registration.pem
      IDENTITY_TOKEN_AUDIENCE: identity-control-api
    volumes:
      - ./keys:/keys:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal, kernel]

  # The provider authority projection's first snapshot, from Organization Control
  # (TDD-identity-control-006 §Bootstrap). Run once Organization Control serves this consumer; safe
  # to rerun, because the snapshot is applied by version.
  provider-bootstrap:
    image: scnehaux-identity-control-dev-migrate
    # The image the migrate service builds; never pulled from a registry, so a task run before
    # the build fails instead of running a published image of the same name.
    pull_policy: never
    profiles: ["provider-bootstrap"]
    entrypoint: ["identity-provider-bootstrap"]
    user: "${KEYS_OWNER:-65532:65532}"
    environment:
      IDENTITY_DATABASE_URL: postgres://identity_app:${IDENTITY_APP_PASSWORD:?set IDENTITY_APP_PASSWORD in .env}@postgres:5432/identity_control?sslmode=disable
      # Optional here, because compose interpolates every service, profiled or not: a required
      # variable would stop every `up`. The command itself refuses an empty one.
      IDENTITY_ORGANIZATION_BASE_URL: ${IDENTITY_ORGANIZATION_BASE_URL:-}
      IDENTITY_WORKLOAD_CLIENT_ID: identity-control-workload
      IDENTITY_WORKLOAD_KEY_FILE: /keys/identity-control-workload.pem
      IDENTITY_WORKLOAD_TOKEN_URL: http://keycloak:8080/realms/scnehaux/protocol/openid-connect/token
      IDENTITY_WORKLOAD_AUDIENCE: ${KEYCLOAK_ISSUER:?set KEYCLOAK_ISSUER in .env}
    volumes:
      - ./keys:/keys:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal, kernel, api]

  identity-control:
    build:
      context: ../..
      target: service
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    restart: unless-stopped
    # The service signs with private keys in ./keys, mode 0600 and owned by KEYS_OWNER, which is the
    # image's nonroot user unless a local override says otherwise.
    user: "${KEYS_OWNER:-65532:65532}"
    environment:
      # The runtime login role: DML, no DDL.
      IDENTITY_DATABASE_URL: postgres://identity_app:${IDENTITY_APP_PASSWORD:?set IDENTITY_APP_PASSWORD in .env}@postgres:5432/identity_control?sslmode=disable
      IDENTITY_LISTEN_ADDRESS: ":8090"
      IDENTITY_KEYCLOAK_REALM: scnehaux
      IDENTITY_KEYCLOAK_BASE_URL: http://keycloak:8080
      # Both Admin API clients authenticate with their own key by signed JWT; no client secret
      # exists (ADR-IAM-001 §5.12). The keys are made on this host by create-kernel-clients.sh and
      # create-registration-client.sh, and the kernel holds only their public halves.
      IDENTITY_KEYCLOAK_CLIENT_ID: identity-control
      IDENTITY_KEYCLOAK_CLIENT_KEY_FILE: /keys/identity-control.pem
      # The registration path's own credential: clients and admin events, no users.
      IDENTITY_REGISTRATION_KEYCLOAK_CLIENT_ID: identity-control-registration
      IDENTITY_REGISTRATION_KEYCLOAK_CLIENT_KEY_FILE: /keys/identity-control-registration.pem
      IDENTITY_REGISTRATION_RECONCILE_INTERVAL: ${IDENTITY_REGISTRATION_RECONCILE_INTERVAL:-1h}
      # The key ring that seals security_ref handles, made by create-security-ref-key.sh
      # (TDD-identity-control-005 §Configuration).
      IDENTITY_SECURITY_REF_KEY_FILE: /keys/security-ref.json
      # The two rollout switches (TDD-identity-control-003 §Configuration, TDD-identity-control-001
      # §Caller Token). Both default to report, so a server that sets neither runs as before; set
      # either in .env and recreate the service. compose passes a container only what is listed here,
      # so a setting missing from this list is a setting .env cannot reach.
      IDENTITY_UNMANAGED_CLIENTS: ${IDENTITY_UNMANAGED_CLIENTS:-report}
      # Whether the Principal sweep disables a kernel user no mapping accounts for, or only records it
      # (TDD-identity-control-001 1.13.0). Report on a development server, whose realm may hold users
      # made before this service; GET /v1/principals:unmapped lists them.
      IDENTITY_UNMAPPED_USERS: ${IDENTITY_UNMAPPED_USERS:-report}
      # Account security notifications (TDD-identity-control-008): standin on a development server
      # accepts them and delivers none, until the Notification Platform exists. Empty records and
      # waits.
      IDENTITY_NOTIFICATION_DELIVERY: ${IDENTITY_NOTIFICATION_DELIVERY:-}
      IDENTITY_TOKEN_TYPE: ${IDENTITY_TOKEN_TYPE:-report}
      # Provider routes require acr aal2 (ADR-IAM-004). report serves a lower token and logs it, for a
      # server whose kernel does not yet map the levels; deploy identity-kernel first and keep enforce.
      IDENTITY_ASSURANCE: ${IDENTITY_ASSURANCE:-enforce}
      # The OpenTelemetry Collector's OTLP/HTTP base URL. Empty: no metric or trace leaves the service.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # A development server: a registration may hold fewer than two owners (ADR-IAM-003 §5.1).
      IDENTITY_ENVIRONMENT: non-production
      # The issuer is the kernel's public one, whatever address Keycloak is reached on: Keycloak's
      # hostname fixes iss. The key set is fetched over the private network. It is configuration and
      # never read from a token, because a token that could name its own key source would choose the
      # key that validates it.
      IDENTITY_TOKEN_ISSUER: ${KEYCLOAK_ISSUER:?set KEYCLOAK_ISSUER in .env}
      # The keyless resource registration, never the Admin API client (STD-IAM-002 §3.1). Set in
      # .env only while a server moves to it (README.md §Moving a server to identity-control-api):
      # the new binary has to verify the old audience while the callers' audience is changed.
      IDENTITY_TOKEN_AUDIENCE: ${IDENTITY_TOKEN_AUDIENCE:-identity-control-api}
      IDENTITY_JWKS_URL: http://keycloak:8080/realms/scnehaux/protocol/openid-connect/certs
      # Provider authority from Organization Control (TDD-identity-control-006). Empty until
      # organization-control's stack serves this consumer: the intake then answers 503, the
      # projection is never fresh, and the ceremony's grant is the only provider authority.
      # organization-control's deploy/dev README sets both.
      IDENTITY_DELIVERY_PRINCIPAL_ID: ${IDENTITY_DELIVERY_PRINCIPAL_ID:-}
      IDENTITY_ORGANIZATION_BASE_URL: ${IDENTITY_ORGANIZATION_BASE_URL:-}
      IDENTITY_WORKLOAD_CLIENT_ID: identity-control-workload
      IDENTITY_WORKLOAD_KEY_FILE: /keys/identity-control-workload.pem
      IDENTITY_WORKLOAD_TOKEN_URL: http://keycloak:8080/realms/scnehaux/protocol/openid-connect/token
      IDENTITY_WORKLOAD_AUDIENCE: ${KEYCLOAK_ISSUER:?set KEYCLOAK_ISSUER in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./keys:/keys:ro
    ports:
      - "127.0.0.1:${IDENTITY_CONTROL_PORT:-8082}:8090"
    networks: [internal, kernel, api]

volumes:
  postgres:

networks:
  internal:
  # The network other stacks call this service on. It carries identity-control alone; a calling
  # stack, organization-control's, joins it as external (STD-GLB-009 §Development Server Deployment).
  api:
    name: scnehaux-identity-control-api
  kernel:
    external: true
    name: scnehaux-identity-api
