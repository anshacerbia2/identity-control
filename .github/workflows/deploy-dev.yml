name: deploy-dev

# Brings up deploy/dev exactly as the development server runs it, beside the real kernel stack from
# identity-kernel's main: the kernel and its realm applied by realm-apply, this service's clients
# registered, its database built by the migration job, the service started, the bootstrap ceremony
# performed, and the smoke suite run against it with a provider-scope token obtained through the
# kernel's login form.
#
# It proves the pieces fit, which no unit or integration test here can: the realm identity-kernel
# declares carries the profile this service's verifier demands, and the Admin API client holds
# enough privilege and no more.

on:
  push:
    branches: [main]
  pull_request:
  # The restore drill runs on every change, and weekly so it runs when nothing changes: STD-GLB-007
  # asks for a drill at least every 90 days (STD-GLB-002 §Restore Evidence).
  schedule:
    - cron: "41 3 * * 1"
  # Run by hand with a kernel branch, to prove this service against a kernel change before it merges.
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: identity-kernel branch, tag or commit to run beside this service
        required: false
        default: main
      experience_ref:
        description: identity-experience branch, tag or commit whose create-bff-client.sh the adoption runs against
        required: false
        default: main

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  stack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: anshacerbia2/identity-kernel
          ref: ${{ inputs.kernel_ref || 'main' }}
          path: .kernel

      # identity-experience's create-bff-client.sh, which made the BFF's client on the development
      # server, so the adoption procedure below runs against a client made the same way.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: anshacerbia2/identity-experience
          ref: ${{ inputs.experience_ref || 'main' }}
          path: .experience

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false

      - name: start the kernel and apply its realm
        working-directory: .kernel/deploy/dev
        run: |
          {
            echo "KEYCLOAK_HOSTNAME=localhost"
            echo "ADMIN_ALLOW_CIDRS=192.0.2.1/32"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "KC_BOOTSTRAP_ADMIN_USERNAME=admin"
            echo "KC_BOOTSTRAP_ADMIN_PASSWORD=$(openssl rand -hex 16)"
          } > .env
          docker compose -f compose.yaml -f compose.ci.yaml up -d --wait --wait-timeout 300 postgres keycloak caddy
          # The kernel's realm-apply job is one-shot: wait for its exit code, as identity-kernel's own
          # deploy-dev does. Started alongside the check below, it races it, and the check then finds
          # a realm built but not yet recorded as applied.
          docker compose -f compose.yaml -f compose.ci.yaml up -d realm-apply
          code="$(docker wait "$(docker compose -f compose.yaml -f compose.ci.yaml ps -aq realm-apply)")"
          docker compose -f compose.yaml -f compose.ci.yaml logs --no-color realm-apply
          [ "$code" = "0" ] || { echo "::error::the kernel's realm-apply job exited $code"; exit 1; }
          # realm-apply's service account authenticates with its own key; the key belongs to the
          # runner here because realm-apply runs on the runner below, not in its container.
          bash ./new-client-key.sh realm-apply ./keys "$(id -u):$(id -g)"
          bash ./create-apply-client.sh > "$RUNNER_TEMP/kernel-client.env"
          set -a; . "$RUNNER_TEMP/kernel-client.env"; set +a
          export KEYCLOAK_ADMIN_CLIENT_KEY_FILE="$PWD/keys/realm-apply.pem"
          cd ../..
          go run ./cmd/realm-apply -environment development -url http://localhost:8080 -apply

      - name: configure this stack
        working-directory: deploy/dev
        run: |
          kernel_password="$(grep '^KC_BOOTSTRAP_ADMIN_PASSWORD=' ../../.kernel/deploy/dev/.env | cut -d= -f2-)"
          {
            echo "KEYCLOAK_ISSUER=https://localhost/realms/scnehaux"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "IDENTITY_APP_PASSWORD=$(openssl rand -hex 16)"
            echo "IDENTITY_CALLER_PASSWORD=$(openssl rand -hex 16)"
            echo "KERNEL_KEYCLOAK_CONTAINER=scnehaux-identity-dev-keycloak-1"
            echo "KC_BOOTSTRAP_ADMIN_USERNAME=admin"
            echo "KC_BOOTSTRAP_ADMIN_PASSWORD=$kernel_password"
            # The kernel's key tools, and the owner of this service's private keys. The runner
            # owns them here, and the containers run as the runner, so dev-credential-split.ps1
            # can sign with the same keys the service does.
            echo "KERNEL_DEPLOY_DIR=$GITHUB_WORKSPACE/.kernel/deploy/dev"
            echo "KEYS_OWNER=$(id -u):$(id -g)"
            # Short enough that Proof B sees the schedule run within the job.
            echo "IDENTITY_REGISTRATION_RECONCILE_INTERVAL=20s"
            # Proof B scenario 6b proves the Principal sweep disables what it finds, against the live
            # kernel, and that it never touches a service-account user (TDD-identity-control-001 1.13.0).
            echo "IDENTITY_UNMAPPED_USERS=disable"
            # The development stand-in for the Notification Platform (TDD-identity-control-008).
            echo "IDENTITY_NOTIFICATION_DELIVERY=standin"
          } > .env

      - name: register this service's clients in the kernel
        working-directory: deploy/dev
        run: bash ./create-kernel-clients.sh >> .env

      # The development server runs this once, by hand. CI runs it on every change, against a kernel
      # that lives for this job, so the script the server's operator runs is the one that was tested.
      - name: register the registration path's client
        working-directory: deploy/dev
        run: bash ./create-registration-client.sh >> .env

      - name: a second registration-client run is refused
        working-directory: deploy/dev
        run: |
          if bash ./create-registration-client.sh; then
            echo "::error::create-registration-client.sh ran twice; it must refuse an existing client"
            exit 1
          fi

      - name: make the security_ref key ring
        working-directory: deploy/dev
        run: |
          bash ./create-security-ref-key.sh
          if bash ./create-security-ref-key.sh; then
            echo "::error::create-security-ref-key.sh ran twice; it must refuse an existing ring"
            exit 1
          fi

      # TDD-identity-control-003 §Testing Strategy: the registration credential cannot touch a user,
      # and the Principal path's cannot touch a client. Asserted against this live kernel.
      - name: the two Admin API credentials are split
        run: |
          set -a; . deploy/dev/.env; set +a
          export KC_ADMIN_URL=http://localhost:8080
          export IDENTITY_KEYCLOAK_CLIENT_KEY_FILE="$PWD/deploy/dev/keys/identity-control.pem"
          export IDENTITY_REGISTRATION_KEYCLOAK_CLIENT_KEY_FILE="$PWD/deploy/dev/keys/identity-control-registration.pem"
          pwsh -NoProfile -File scripts/dev-credential-split.ps1

      - name: build, migrate, and start the service
        working-directory: deploy/dev
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8082/readyz >/dev/null 2>&1; then
              echo "ready after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::identity-control did not report ready within 120s"
          docker compose logs --no-color
          exit 1

      # No image this stack names without a digest is pulled from a registry (TDD-identity-control-001
      # §The Migrate Image and Its Exceptions). Compose pulls a service's image name before building
      # unless pull_policy says otherwise, and a published image of that name would run instead. Every
      # undigested name must be pull_policy build where the service builds it and never elsewhere, and
      # the migrate image in use must carry no registry digest: it was built here, not pulled.
      - name: no image named here is pulled from a registry
        working-directory: deploy/dev
        run: |
          docker compose --profile '*' config --format json > "$RUNNER_TEMP/compose-config.json"
          python3 - "$RUNNER_TEMP/compose-config.json" <<'PY'
          import json, sys
          services = json.load(open(sys.argv[1]))["services"]
          bad = []
          for name, service in sorted(services.items()):
              image = service.get("image")
              if image and "@sha256:" not in image:
                  want = "build" if "build" in service else "never"
                  if service.get("pull_policy") != want:
                      bad.append(f"{name}: {image} has pull_policy {service.get('pull_policy')!r}, want {want!r}")
                  else:
                      print(f"{name}: {image}, pull_policy {want}")
          for message in bad:
              print(f"::error::{message}")
          sys.exit(1 if bad else 0)
          PY
          digests="$(docker image inspect -f '{{len .RepoDigests}}' scnehaux-identity-control-dev-migrate)"
          if [ "$digests" != 0 ]; then
            echo "::error::scnehaux-identity-control-dev-migrate carries a registry digest: it was pulled, not built"
            exit 1
          fi
          echo "scnehaux-identity-control-dev-migrate has no registry digest: built here"

      - name: the migration job left the privilege shape it asserts
        working-directory: deploy/dev
        run: docker compose logs --no-color migrate | grep -F "control database ready"

      - name: perform the bootstrap ceremony
        working-directory: deploy/dev
        run: bash ./bootstrap.sh "ci@scnehaux.local" "deploy-dev workflow"

      - name: the ceremony succeeds only once
        working-directory: deploy/dev
        run: |
          if docker compose run --rm bootstrap -operator "ci@scnehaux.local" -reason "again" \
               -username second-operator -email second@scnehaux.local; then
            echo "::error::a second bootstrap ceremony succeeded; it must be refused"
            exit 1
          fi

      # The kernel's hostname is https://localhost, so its login form posts to https://localhost through
      # Caddy, whose certificate comes from Caddy's own local CA. Trusting that CA is what lets the login run
      # over TLS end to end, the way it does on a server whose tunnel or DNS name has a real certificate --
      # rather than falling back to plain HTTP and taking a code path production never takes.
      - name: trust the kernel proxy's local certificate authority
        run: |
          docker cp scnehaux-identity-dev-caddy-1:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/caddy-root.crt"
          sudo cp "$RUNNER_TEMP/caddy-root.crt" /usr/local/share/ca-certificates/caddy-local-root.crt
          sudo update-ca-certificates
          curl -fsS https://localhost/realms/scnehaux/.well-known/openid-configuration >/dev/null

      # STD-GLB-009 1.3.0: a procedure step runs in CI. deploy/dev/README.md §First start step 8 adopts
      # the development caller with scripts/dev-adopt-caller.ps1, a plan and then -Apply, exactly as it
      # runs here. The smoke's own step 9b then finds the caller registered already.
      - name: the caller adoption procedure
        run: |
          set -a; . deploy/dev/.env; set +a
          export IDENTITY_API_URL=http://127.0.0.1:8082 KC_BASE_URL=https://localhost
          export IDENTITY_OPERATOR_TOTP_FILE="$RUNNER_TEMP/operator-totp.json"
          pwsh -NoProfile -File scripts/dev-adopt-caller.ps1
          pwsh -NoProfile -File scripts/dev-adopt-caller.ps1 -Apply
          pwsh -NoProfile -File scripts/dev-adopt-caller.ps1 | grep -F "registered already"

      - name: smoke the API with a provider-scope token
        run: |
          set -a; . deploy/dev/.env; set +a
          # Provider routes require aal2 (ADR-IAM-004), enforced here: the smoke enrolls the bootstrap
          # operator's TOTP on its first sign-in and computes its codes after.
          export IDENTITY_API_URL=http://127.0.0.1:8082 KC_BASE_URL=https://localhost
          export IDENTITY_OPERATOR_TOTP_FILE="$RUNNER_TEMP/operator-totp.json"
          pwsh -NoProfile -File scripts/dev-smoke.ps1

      # TDD-identity-control-002 2.3.0, ADR-IAM-006: the Tenant context end to end against this
      # kernel. The script stands in for Organization Control: it registers a delivering workload, the
      # service is restarted to admit it, and Membership and Tenant events posted to /v1/deliveries
      # must reach a token's tenant_id, and a revocation must refuse that Tenant's refresh. The
      # revocation's accept-to-enforcement delay goes to the job summary (TDD-identity-control-002 2.4.0).
      - name: the Tenant context end to end
        run: |
          set -o pipefail
          set -a; . deploy/dev/.env; set +a
          export IDENTITY_API_URL=http://127.0.0.1:8082 KC_BASE_URL=https://localhost KC_ADMIN_URL=http://localhost:8080
          export IDENTITY_OPERATOR_TOTP_FILE="$RUNNER_TEMP/operator-totp.json"
          state="$RUNNER_TEMP/tenant-proof/state.json"
          mkdir -p "$(dirname "$state")"
          line="$(pwsh -NoProfile -File scripts/dev-tenant-proof.ps1 -Phase setup -State "$state" | tail -n 1)"
          principal="${line#DELIVERY_PRINCIPAL_ID=}"
          [ -n "$principal" ] && [ "$principal" != "$line" ] || { echo "::error::the setup named no delivering workload"; exit 1; }
          sed -i '/^IDENTITY_DELIVERY_PRINCIPAL_ID=/d' deploy/dev/.env
          echo "IDENTITY_DELIVERY_PRINCIPAL_ID=$principal" >> deploy/dev/.env
          (cd deploy/dev && docker compose up -d identity-control)
          for i in $(seq 1 60); do
            curl -fsS "$IDENTITY_API_URL/readyz" >/dev/null 2>&1 && break
            sleep 1
          done
          pwsh -NoProfile -File scripts/dev-tenant-proof.ps1 -Phase prove -State "$state"

      # STD-GLB-009 1.3.0: a procedure step runs in CI. The BFF's client is made the way the development
      # server's was, by identity-experience's create-bff-client.sh, then adopted by
      # scripts/dev-adopt-bff.ps1 exactly as deploy/dev/README.md tells an operator to. A wrong
      # declaration is refused on audience_profile (ADR-IAM-001 §5.12 rule 3), and the adopted BFF's own
      # token at aal2 is served on a provider route. The client holds two keys, one per developer
      # device, installed with the kernel's set-client-key.sh, so the adoption declares both and a
      # declaration of one is refused on client_keys.
      - name: the BFF adoption procedure
        run: |
          set -a; . deploy/dev/.env; set +a
          export IDENTITY_API_URL=http://127.0.0.1:8082 KC_BASE_URL=https://localhost
          export IDENTITY_OPERATOR_TOTP_FILE="$RUNNER_TEMP/operator-totp.json"
          keys="$RUNNER_TEMP/bff-keys"
          bash .kernel/deploy/dev/new-client-key.sh identity-experience-bff "$keys" "$(id -u):$(id -g)"
          bash .experience/deploy/dev/create-bff-client.sh deploy/dev/.env "$keys/identity-experience-bff.jwk.json"
          bash .kernel/deploy/dev/new-client-key.sh identity-experience-bff-second-device "$keys" "$(id -u):$(id -g)"
          bash .kernel/deploy/dev/set-client-key.sh scnehaux identity-experience-bff \
            "$keys/identity-experience-bff.jwk.json" "$keys/identity-experience-bff-second-device.jwk.json"
          pwsh -NoProfile -File scripts/dev-bff-adoption-proof.ps1 \
            -BffJwkFile "$keys/identity-experience-bff.jwk.json,$keys/identity-experience-bff-second-device.jwk.json" \
            -BffKeyFile "$keys/identity-experience-bff.pem"

      # TDD-identity-control-007: the kernel event record, against this kernel's native store, which the
      # steps above filled with sign-ins and admin changes. Before Proof B, which stops Keycloak.
      - name: the kernel event record
        run: |
          set -a; . deploy/dev/.env; set +a
          export IDENTITY_API_URL=http://127.0.0.1:8082 KC_BASE_URL=https://localhost
          export IDENTITY_OPERATOR_TOTP_FILE="$RUNNER_TEMP/operator-totp.json"
          pwsh -NoProfile -File scripts/dev-kernel-events-proof.ps1

      # TDD-identity-control-008: the sweep above recorded the bootstrap operator's TOTP enrolment, so
      # its notifications are requested to the creation address and the stand-in accepts them.
      - name: account security notifications
        run: |
          set -a; . deploy/dev/.env; set +a
          export IDENTITY_API_URL=http://127.0.0.1:8082 KC_BASE_URL=https://localhost
          export IDENTITY_OPERATOR_TOTP_FILE="$RUNNER_TEMP/operator-totp.json"
          pwsh -NoProfile -File scripts/dev-notifications-proof.ps1

      # ROADMAP §Gates, production gate: session removal's accept-to-enforcement delay, measured
      # against this kernel (TDD-identity-control-005 2.10.0 §Enforcement Delay). It ends the bootstrap
      # operator's sessions, so it runs after every step that reads them.
      - name: session removal within budget
        run: |
          set -a; . deploy/dev/.env; set +a
          export IDENTITY_API_URL=http://127.0.0.1:8082 KC_BASE_URL=https://localhost KC_ADMIN_URL=http://localhost:8080
          export IDENTITY_OPERATOR_TOTP_FILE="$RUNNER_TEMP/operator-totp.json"
          pwsh -NoProfile -File scripts/dev-session-removal-proof.ps1

      # ADR-IAM-009, TDD-identity-control-003 1.37.0: a confidential client registered from zero with a
      # backchannel_logout_uri, as a BFF the kernel can reach is, receives a signed logout token naming
      # its session when the Identity Control API ends that session. The receiver stands where a BFF's
      # POST /auth/back-channel-logout stands, on the kernel network's gateway, which is the address the
      # kernel's container reaches this runner on. After the session removal proof, which ends every
      # session of the operator, so the session it ends is its own.
      - name: back-channel logout reaches a registered client
        run: |
          set -a; . deploy/dev/.env; set +a
          export IDENTITY_API_URL=http://127.0.0.1:8082 KC_BASE_URL=https://localhost
          export IDENTITY_OPERATOR_TOTP_FILE="$RUNNER_TEMP/operator-totp.json"
          network="$(docker inspect -f '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' scnehaux-identity-dev-keycloak-1 | head -n 1)"
          gateway="$(docker network inspect -f '{{range .IPAM.Config}}{{println .Gateway}}{{end}}' "$network" | head -n 1)"
          [ -n "$gateway" ] || { echo "::error::no gateway for the kernel's network $network"; exit 1; }
          work="$RUNNER_TEMP/back-channel-logout"
          mkdir -p "$work"
          python3 scripts/dev-logout-receiver.py 0.0.0.0 8199 "$work/received.jsonl" &
          receiver=$!
          trap 'kill "$receiver"' EXIT
          for i in $(seq 1 50); do
            curl -s -o /dev/null -X POST "http://127.0.0.1:8199/ready" && break
            sleep 0.2
          done
          pwsh -NoProfile -File scripts/dev-back-channel-logout-proof.ps1 \
            -ReceiverUrl "http://$gateway:8199/back-channel-logout" -Received "$work/received.jsonl" -WorkDir "$work"

      # ROADMAP §Gates, production gate: the Keycloak administration credentials' rotation, rehearsed
      # with deploy/dev/rotate-client-key.sh exactly as deploy/dev/README.md §Keys tells an operator,
      # on a kernel that lives for this job. Before Proof B, which then runs on the rotated keys.
      - name: the Admin API credentials rotate
        run: |
          set -a; . deploy/dev/.env; set +a
          export IDENTITY_API_URL=http://127.0.0.1:8082 KC_BASE_URL=https://localhost
          export IDENTITY_OPERATOR_TOTP_FILE="$RUNNER_TEMP/operator-totp.json"
          for client in identity-control identity-control-registration; do
            ROTATE_KEEP_PREVIOUS=1 bash deploy/dev/rotate-client-key.sh "$client"
            pwsh -NoProfile -File scripts/dev-key-rotation-proof.ps1 -Client "$client" \
              -KeyFile "deploy/dev/keys/$client.pem" -PreviousKeyFile "deploy/dev/keys/$client-previous.pem"
            rm -f "deploy/dev/keys/$client-previous.pem" "deploy/dev/keys/$client-previous.jwk.json"
          done

      # identity-control ROADMAP §Proof B: both drift scenarios, a drift exception and its expiry,
      # and Keycloak stopped then started, against this live kernel. Each convergence time lands in
      # the job summary. Last, because it stops the kernel's Keycloak.
      - name: Proof B against the live kernel
        run: |
          set -a; . deploy/dev/.env; set +a
          export IDENTITY_API_URL=http://127.0.0.1:8082 KC_BASE_URL=https://localhost KC_ADMIN_URL=http://localhost:8080
          export IDENTITY_OPERATOR_TOTP_FILE="$RUNNER_TEMP/operator-totp.json"
          pwsh -NoProfile -File scripts/dev-proof-b.ps1
      # deploy/dev/README.md §First start ends here, steps 10 and 11 (STD-GLB-009 1.3.0: a procedure step
      # runs in CI): with the caller and the BFF adopted, the server is moved to
      # IDENTITY_UNMANAGED_CLIENTS=disable and IDENTITY_TOKEN_TYPE=enforce, recreated, and must still serve
      # its callers with no client recorded unmanaged and no token refused for its type. After Proof B,
      # whose scenario 8 needs report mode; the restore drill below then runs in these settings.
      - name: the from-zero procedure ends in the production settings
        run: |
          set -a; . deploy/dev/.env; set +a
          export IDENTITY_API_URL=http://127.0.0.1:8082 KC_BASE_URL=https://localhost
          export IDENTITY_OPERATOR_TOTP_FILE="$RUNNER_TEMP/operator-totp.json"
          cd deploy/dev
          sed -i '/^IDENTITY_UNMANAGED_CLIENTS=/d; /^IDENTITY_TOKEN_TYPE=/d' .env
          echo IDENTITY_UNMANAGED_CLIENTS=disable >> .env
          echo IDENTITY_TOKEN_TYPE=enforce >> .env
          since="$(date -u +%FT%TZ)"
          docker compose up -d identity-control
          for i in $(seq 1 60); do
            curl -fsS "$IDENTITY_API_URL/readyz" >/dev/null 2>&1 && break
            sleep 1
          done
          environment="$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$(docker compose ps -q identity-control)")"
          grep -qx 'IDENTITY_UNMANAGED_CLIENTS=disable' <<<"$environment" || { echo "::error::the service did not take IDENTITY_UNMANAGED_CLIENTS=disable"; exit 1; }
          grep -qx 'IDENTITY_TOKEN_TYPE=enforce' <<<"$environment" || { echo "::error::the service did not take IDENTITY_TOKEN_TYPE=enforce"; exit 1; }
          (cd ../.. && pwsh -NoProfile -File scripts/dev-production-switches.ps1)
          if docker compose logs --no-color --since "$since" identity-control | grep -F 'not typed at+jwt'; then
            echo "::error::a token not typed at+jwt reached the service after the switch"
            exit 1
          fi

      # ROADMAP §Gates, production gate: restore evidence for the Control Database (STD-GLB-002
      # §Restore Evidence, TDD-identity-control-001 §Restore Evidence). The stack every step above
      # filled is backed up with deploy/dev/backup.sh, its volume deleted, and restored with
      # deploy/dev/restore.sh; schema, migration, every table, sequence and role are compared, the
      # service restarted and read, and the recovery timed against the 15-minute RTO. Last, because it
      # deletes the database. The same run drills a restore older than the kernel: changes made after
      # the backup, the restored service in report mode, and the runbook's reconciliation checked
      # (scripts/dev-restore-older-point.ps1), the Tenant proof's delivering workload standing in for
      # Organization Control's repair.
      - name: the Control Database restores from its backup
        run: |
          set -a; . deploy/dev/.env; set +a
          export IDENTITY_API_URL=http://127.0.0.1:8082 KC_BASE_URL=https://localhost KC_ADMIN_URL=http://localhost:8080
          export IDENTITY_OPERATOR_TOTP_FILE="$RUNNER_TEMP/operator-totp.json"
          export TENANT_PROOF_STATE="$RUNNER_TEMP/tenant-proof/state.json"
          bash scripts/dev-restore-drill.sh "$RUNNER_TEMP/restore-drill"

      # The evidence, never the backup: the dump and the roles file hold role password hashes.
      - name: keep the restore evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: restore-evidence
          path: |
            ${{ runner.temp }}/restore-drill/*.json
            ${{ runner.temp }}/restore-drill/*.txt
            ${{ runner.temp }}/restore-drill/*.sql
            ${{ runner.temp }}/restore-drill/older-point/older-point-evidence.json
            !${{ runner.temp }}/restore-drill/backup/**
          if-no-files-found: ignore
          retention-days: 90

      - name: stack logs
        if: failure()
        run: |
          (cd deploy/dev && docker compose logs --no-color) || true
          (cd .kernel/deploy/dev && docker compose -f compose.yaml -f compose.ci.yaml logs --no-color keycloak) || true
