name: deploy-dev

# Brings up deploy/dev exactly as the development server runs it, beside the real kernel stack from
# identity-kernel's main: the kernel and its realm applied by realm-apply, this service's clients
# registered, its database built by the migration job, the service started, the bootstrap ceremony
# performed, and the smoke suite run against it with a provider-scope token obtained through the
# kernel's login form.
#
# It proves the pieces fit, which no unit or integration test here can: the realm identity-kernel
# declares carries the profile this service's verifier demands, and the Admin API client holds
# enough privilege and no more.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  stack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: anshacerbia2/identity-kernel
          path: .kernel

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false

      - name: start the kernel and apply its realm
        working-directory: .kernel/deploy/dev
        run: |
          {
            echo "KEYCLOAK_HOSTNAME=localhost"
            echo "ADMIN_ALLOW_CIDRS=192.0.2.1/32"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "KC_BOOTSTRAP_ADMIN_USERNAME=admin"
            echo "KC_BOOTSTRAP_ADMIN_PASSWORD=$(openssl rand -hex 16)"
          } > .env
          docker compose -f compose.yaml -f compose.ci.yaml up -d --wait --wait-timeout 300
          # realm-apply's service account authenticates with its own key; the key belongs to the
          # runner here because realm-apply runs on the runner below, not in its container.
          bash ./new-client-key.sh realm-apply ./keys "$(id -u):$(id -g)"
          bash ./create-apply-client.sh > "$RUNNER_TEMP/kernel-client.env"
          set -a; . "$RUNNER_TEMP/kernel-client.env"; set +a
          export KEYCLOAK_ADMIN_CLIENT_KEY_FILE="$PWD/keys/realm-apply.pem"
          cd ../..
          go run ./cmd/realm-apply -environment development -url http://localhost:8080 -apply

      - name: configure this stack
        working-directory: deploy/dev
        run: |
          kernel_password="$(grep '^KC_BOOTSTRAP_ADMIN_PASSWORD=' ../../.kernel/deploy/dev/.env | cut -d= -f2-)"
          {
            echo "KEYCLOAK_ISSUER=https://localhost/realms/scnehaux"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "IDENTITY_APP_PASSWORD=$(openssl rand -hex 16)"
            echo "IDENTITY_CALLER_PASSWORD=$(openssl rand -hex 16)"
            echo "KERNEL_KEYCLOAK_CONTAINER=scnehaux-identity-dev-keycloak-1"
            echo "KC_BOOTSTRAP_ADMIN_USERNAME=admin"
            echo "KC_BOOTSTRAP_ADMIN_PASSWORD=$kernel_password"
            # The kernel's key tools, and the owner of this service's private keys. The runner
            # owns them here, and the containers run as the runner, so dev-credential-split.ps1
            # can sign with the same keys the service does.
            echo "KERNEL_DEPLOY_DIR=$GITHUB_WORKSPACE/.kernel/deploy/dev"
            echo "KEYS_OWNER=$(id -u):$(id -g)"
            # Short enough that Proof B sees the schedule run within the job.
            echo "IDENTITY_REGISTRATION_RECONCILE_INTERVAL=20s"
            # The smoke signs the bootstrap operator in with a password; it enrolls no TOTP, so its
            # token is below the aal2 every provider route requires (ADR-IAM-004). report serves it
            # and logs the shortfall. The enforce path is asserted by internal/httpapi's tests, and
            # the levels themselves by identity-kernel's compat/levels_test.go.
            echo "IDENTITY_ASSURANCE=report"
          } > .env

      - name: register this service's clients in the kernel
        working-directory: deploy/dev
        run: bash ./create-kernel-clients.sh >> .env

      # The development server runs this once, by hand. CI runs it on every change, against a kernel
      # that lives for this job, so the script the server's operator runs is the one that was tested.
      - name: register the registration path's client
        working-directory: deploy/dev
        run: bash ./create-registration-client.sh >> .env

      - name: a second registration-client run is refused
        working-directory: deploy/dev
        run: |
          if bash ./create-registration-client.sh; then
            echo "::error::create-registration-client.sh ran twice; it must refuse an existing client"
            exit 1
          fi

      - name: make the security_ref key ring
        working-directory: deploy/dev
        run: |
          bash ./create-security-ref-key.sh
          if bash ./create-security-ref-key.sh; then
            echo "::error::create-security-ref-key.sh ran twice; it must refuse an existing ring"
            exit 1
          fi

      # TDD-identity-control-003 §Testing Strategy: the registration credential cannot touch a user,
      # and the Principal path's cannot touch a client. Asserted against this live kernel.
      - name: the two Admin API credentials are split
        run: |
          set -a; . deploy/dev/.env; set +a
          export KC_ADMIN_URL=http://localhost:8080
          export IDENTITY_KEYCLOAK_CLIENT_KEY_FILE="$PWD/deploy/dev/keys/identity-control.pem"
          export IDENTITY_REGISTRATION_KEYCLOAK_CLIENT_KEY_FILE="$PWD/deploy/dev/keys/identity-control-registration.pem"
          pwsh -NoProfile -File scripts/dev-credential-split.ps1

      - name: build, migrate, and start the service
        working-directory: deploy/dev
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8082/readyz >/dev/null 2>&1; then
              echo "ready after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::identity-control did not report ready within 120s"
          docker compose logs --no-color
          exit 1

      - name: the migration job left the privilege shape it asserts
        working-directory: deploy/dev
        run: docker compose logs --no-color migrate | grep -F "control database ready"

      - name: perform the bootstrap ceremony
        working-directory: deploy/dev
        run: bash ./bootstrap.sh "ci@scnehaux.local" "deploy-dev workflow"

      - name: the ceremony succeeds only once
        working-directory: deploy/dev
        run: |
          if docker compose run --rm bootstrap -operator "ci@scnehaux.local" -reason "again" \
               -username second-operator -email second@scnehaux.local; then
            echo "::error::a second bootstrap ceremony succeeded; it must be refused"
            exit 1
          fi

      # The kernel's hostname is https://localhost, so its login form posts to https://localhost through
      # Caddy, whose certificate comes from Caddy's own local CA. Trusting that CA is what lets the login run
      # over TLS end to end, the way it does on a server whose tunnel or DNS name has a real certificate --
      # rather than falling back to plain HTTP and taking a code path production never takes.
      - name: trust the kernel proxy's local certificate authority
        run: |
          docker cp scnehaux-identity-dev-caddy-1:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/caddy-root.crt"
          sudo cp "$RUNNER_TEMP/caddy-root.crt" /usr/local/share/ca-certificates/caddy-local-root.crt
          sudo update-ca-certificates
          curl -fsS https://localhost/realms/scnehaux/.well-known/openid-configuration >/dev/null

      - name: smoke the API with a provider-scope token
        run: |
          set -a; . deploy/dev/.env; set +a
          export IDENTITY_API_URL=http://127.0.0.1:8082 KC_BASE_URL=https://localhost
          pwsh -NoProfile -File scripts/dev-smoke.ps1

      # identity-control ROADMAP §Proof B: both drift scenarios, a drift exception and its expiry,
      # and Keycloak stopped then started, against this live kernel. Each convergence time lands in
      # the job summary. Last, because it stops the kernel's Keycloak.
      - name: Proof B against the live kernel
        run: |
          set -a; . deploy/dev/.env; set +a
          export IDENTITY_API_URL=http://127.0.0.1:8082 KC_BASE_URL=https://localhost KC_ADMIN_URL=http://localhost:8080
          pwsh -NoProfile -File scripts/dev-proof-b.ps1
      - name: stack logs
        if: failure()
        run: |
          (cd deploy/dev && docker compose logs --no-color) || true
          (cd .kernel/deploy/dev && docker compose -f compose.yaml -f compose.ci.yaml logs --no-color keycloak) || true
